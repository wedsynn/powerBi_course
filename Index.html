<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Mastery Roadmap & Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#090d16',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.06); }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950 pb-20">

    <!-- Navbar & Header -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-800/80 px-6 py-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-amber-500 to-yellow-400 text-slate-950 font-black p-3 rounded-2xl text-xl shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        Power BI Mastery <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full font-semibold">Pro Roadmap</span>
                    </h1>
                    <p class="text-xs text-slate-400">ETL, Modeling, DAX & Dashboards Roadmap</p>
                </div>
            </div>

            <!-- Progress Tracker Bar -->
            <div class="flex items-center gap-4 w-full md:w-auto bg-dark-900/80 px-4 py-2 rounded-2xl border border-slate-800">
                <div class="text-right">
                    <span id="progressText" class="text-xs font-bold text-amber-400">0 / 14 Completed</span>
                    <div class="w-32 bg-slate-800 h-2 rounded-full overflow-hidden mt-1">
                        <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-yellow-400 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="max-w-7xl mx-auto px-6 mt-8">
        
        <!-- Controls: Search & Category Filters -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <!-- Search Bar -->
            <div class="w-full md:w-96 relative">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search topics, e.g. DAX, Slicer, SQL..." 
                    class="w-full pl-11 pr-4 py-2.5 text-sm bg-dark-900 border border-slate-800 rounded-2xl focus:outline-none focus:border-amber-500 text-slate-200 placeholder-slate-500 transition shadow-inner">
            </div>

            <!-- Filter Pills -->
            <div id="filterContainer" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button data-filter="all" class="filter-btn px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-slate-950 transition shadow-md">All Topics</button>
                <button data-filter="Ingestion" class="filter-btn px-4 py-2 text-xs font-bold rounded-xl bg-dark-900 text-slate-400 border border-slate-800 hover:text-white transition">Ingestion</button>
                <button data-filter="Visuals" class="filter-btn px-4 py-2 text-xs font-bold rounded-xl bg-dark-900 text-slate-400 border border-slate-800 hover:text-white transition">Visuals</button>
                <button data-filter="ETL" class="filter-btn px-4 py-2 text-xs font-bold rounded-xl bg-dark-900 text-slate-400 border border-slate-800 hover:text-white transition">ETL</button>
                <button data-filter="Formulas" class="filter-btn px-4 py-2 text-xs font-bold rounded-xl bg-dark-900 text-slate-400 border border-slate-800 hover:text-white transition">DAX</button>
            </div>
        </div>

        <!-- Roadmap Grid -->
        <div id="roadmapGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Rendered by main.js -->
        </div>

    </main>

    <!-- JavaScript File -->
    <script src="main.js"></script>
</body>
</html>
